
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Zoom Text Animation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#controls {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 90%;
    max-width: 500px;
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #555;
    border-radius: 8px;
    background: #181818;
    color: white;
    outline: none;
}

button {
    padding: 12px 16px;
    border: none;
    border-radius: 8px;
    background: #00d9ff;
    color: black;
    font-weight: bold;
}

#screen {
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#animatedText {
    font-size: clamp(35px, 9vw, 100px);
    font-weight: 900;
    text-align: center;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-width: 90%;
    animation: zoom 3s ease-in-out infinite;
    text-shadow: 0 0 20px #00d9ff;
}

@keyframes zoom {
    0% {
        transform: scale(0.65);
        opacity: 0.6;
    }
    50% {
        transform: scale(1.3);
        opacity: 1;
    }
    100% {
        transform: scale(0.65);
        opacity: 0.6;
    }
}

.fullscreen {
    position: fixed;
    bottom: 20px;
    right: 20px;
}
</style>
</head>

<body>
<div id="screen">
    <div id="animatedText">MADAR CHOD </div>
</div>

<button class="fullscreen" onclick="goFullscreen()">⛶ FULL SCREEN</button>

<script>
function changeText() {
    const text = document.getElementById("textInput").value;
    document.getElementById("animatedText").textContent =
        text || "YOUR TEXT";
}

function goFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
